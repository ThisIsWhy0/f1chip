<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 F1 Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ferrari-red: #ff2800;
            --merc-silver: #00d2be;
            --rb-blue: #061D42;
            --mcl-papaya: #ff8700;
            --dark-bg: #101014;
            --card-bg: #1f1f27;
            --text-main: #ffffff;
            --text-dim: #8a8a95;
            --accent: #ff2800;
            --success: #2ecc71;
            --alert: #e10600;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Titillium Web', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER & TEAM NAV --- */
        header {
            background: linear-gradient(180deg, #1a1a20 0%, #101014 100%);
            padding: 15px 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        .app-title {
            text-align: center;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #fff;
        }

        .team-nav {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-btn {
            background: #2a2a35;
            border: none;
            color: var(--text-dim);
            padding: 10px 5px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        .nav-btn.active { color: #fff; background: #333; }
        .nav-btn[data-team="1"].active { border-color: var(--ferrari-red); }
        .nav-btn[data-team="2"].active { border-color: var(--rb-blue); }
        .nav-btn[data-team="3"].active { border-color: var(--mcl-papaya); }

        /* --- MAIN CONTENT --- */
        main {
            flex: 1;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .team-indicator {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .emergency-btn {
            background: rgba(225, 6, 0, 0.2);
            color: var(--alert);
            border: 1px solid var(--alert);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* --- WIZARD CARDS --- */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease-out;
            border: 1px solid #2a2a35;
        }

        .card-header { font-size: 0.8rem; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .question { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; line-height: 1.2; }
        .context { font-size: 0.95rem; color: var(--text-dim); margin-bottom: 25px; line-height: 1.5; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn {
            padding: 18px;
            border-radius: 10px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-yes { background: #fff; color: #000; }
        .btn-no { background: #333; color: #fff; }

        /* --- RESULT SCREEN --- */
        .result-icon { font-size: 3.5rem; display: block; margin-bottom: 15px; }
        .result-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .result-desc { font-size: 1.1rem; color: #ccc; margin-bottom: 20px; }
        
        .strategy-box {
            background: rgba(0,0,0,0.2);
            border-left: 4px solid var(--accent);
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }
        .strategy-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 5px; }
        .strategy-text { font-size: 0.95rem; color: #fff; }

        .reset-link {
            display: block;
            text-align: center;
            color: var(--text-dim);
            text-decoration: underline;
            margin-top: 15px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<header>
    <div class="app-title">F1 2026 StratOS</div>
    <div class="team-nav">
        <button class="nav-btn active" data-team="1" onclick="setTeam(1)">Alpha<br><span style="font-size:0.6rem; opacity:0.7">MER / FER</span></button>
        <button class="nav-btn" data-team="2" onclick="setTeam(2)">RB Hedge<br><span style="font-size:0.6rem; opacity:0.7">VER / RB</span></button>
        <button class="nav-btn" data-team="3" onclick="setTeam(3)">McLaren<br><span style="font-size:0.6rem; opacity:0.7">NOR / MCL</span></button>
    </div>
</header>

<main>
    <div class="status-bar">
        <span class="team-indicator" id="team-label">Team 1: The Safe Build</span>
        <button class="emergency-btn" onclick="triggerEmergency()">🚨 Emergency</button>
    </div>

    <div id="wizard-content">
        </div>
</main>

<script>
    // --- STRATEGY DATABASE ---
    const strategies = {
        1: {
            name: "Alpha (Merc/Ferrari)",
            color: "#e10600",
            startNode: 'q1',
            nodes: {
                'q1': { q: "Is it a Sprint Weekend?", c: "Shanghai, Miami, Austin, Qatar, etc.", y: 'limitless', n: 'q2' },
                'q2': { q: "Is severe weather forecast?", c: "Heavy rain creates high variance/crash risk.", y: 'autopilot', n: 'q3' },
                'q3': { q: "Is this a 'Street Circuit'?", c: "Monaco, Baku, Singapore (High attrition).", y: 'nonegative', n: 'q4' },
                'q4': { q: "Is it the Spanish or British GP?", c: "Major upgrade deadline. Pecking order shift.", y: 'wildcard', n: 'q5' },
                'q5': { q: "Is it Monza or Spa?", c: "Pure power tracks (Long straights).", y: '3x_verstappen', n: 'standard' }
            }
        },
        2: {
            name: "Red Bull Hedge",
            color: "#061D42",
            startNode: 'q1',
            nodes: {
                'q1': { q: "Is it a Sprint Weekend?", c: "Max points available. 4 Scoring events.", y: 'limitless_rb', n: 'q2' },
                'q2': { q: "Is it Monza, Spa, or Vegas?", c: "The 'Sandbag' Theory: RB22 energy deployment is king here.", y: '3x_max', n: 'q3' },
                'q3': { q: "Is it Monaco or Hungary?", c: "High Downforce. RB22 weakness. Crash risk.", y: 'autopilot', n: 'q4' },
                'q4': { q: "Did Max Qualify P10 or lower?", c: "Recovery drive is risky.", y: 'finalfix_max', n: 'standard_max' }
            }
        },
        3: {
            name: "McLaren Loyalty",
            color: "#ff8700",
            startNode: 'q1',
            nodes: {
                'q1': { q: "Is it a Sprint Weekend?", c: "Maximize Lando/Oscar output.", y: 'limitless', n: 'q2' },
                'q2': { q: "Is it Silverstone, Spain, or Suzuka?", c: "High Tire Deg. MCL40 excels in race trim here.", y: '3x_lando', n: 'q3' },
                'q3': { q: "Did Ferrari/Merc look unreliable in Practice?", c: "Engine failures or DNF risks?", y: 'wildcard', n: 'standard_mcl' }
            }
        }
    };

    const results = {
        'limitless': { 
            title: "Limitless Chip", icon: "♾️", 
            desc: "Ignore the budget cap.", 
            logic: "Sprint weekends have 33% more points. Buy the 'God Squad' (Verstappen, Norris, Leclerc, Merc, Ferrari) for one week only." 
        },
        'limitless_rb': { 
            title: "Limitless (RB Focus)", icon: "♾️", 
            desc: "Unlimited Budget + Max Captain.", 
            logic: "Even with unlimited cash, ensure Max is your 2x. Build the rest with Ferrari/Merc assets." 
        },
        'autopilot': { 
            title: "Autopilot Chip", icon: "🤖", 
            desc: "Do not pick a captain manually.", 
            logic: "Rain/Chaos means your chosen captain might DNF. Autopilot guarantees the 2x goes to the survivor." 
        },
        'nonegative': { 
            title: "No Negative Chip", icon: "🛡️", 
            desc: "Protect against DNFs.", 
            logic: "Street circuits (Monaco/Baku) have -20pt penalties lurking everywhere. Use this if running risky midfielders." 
        },
        'wildcard': { 
            title: "Wildcard Chip", icon: "🃏", 
            desc: "Total Team Reset.", 
            logic: "The upgrades have landed. The old hierarchy is dead. Permanently restructure your team to the new fastest car." 
        },
        '3x_verstappen': { 
            title: "3x Boost: Max", icon: "🚀", 
            desc: "Triple Points on Verstappen.", 
            logic: "If you own him, play it here. If not, save the chip. This track rewards the RB22's straight-line speed." 
        },
        '3x_max': { 
            title: "3x Boost: Max", icon: "🚀", 
            desc: "Triple Points on Verstappen.", 
            logic: "This is the moment. The 1.0s/lap advantage is real on these straights. Maximum attack." 
        },
        '3x_lando': { 
            title: "3x Boost: Lando", icon: "🧡", 
            desc: "Triple Points on Norris.", 
            logic: "High tire degradation suits the McLaren. He will catch the Ferraris in the final stint." 
        },
        'finalfix_max': { 
            title: "Final Fix Chip", icon: "🔧", 
            desc: "Swap Max for P1 Starter.", 
            logic: "Max is starting too far back. Don't risk the recovery. Swap him for Russell/Leclerc (whoever is on Pole)." 
        },
        'standard': { 
            title: "2x Boost: Hadjar", icon: "✅", 
            desc: "Save Chips. Trust the Process.", 
            logic: "Isack Hadjar is your mathematical MVP. He is in a Red Bull but priced like a rookie." 
        },
        'standard_max': { 
            title: "2x Boost: Verstappen", icon: "🦁", 
            desc: "Save Chips. Force Max.", 
            logic: "You are paying for the World Champion. You captain the World Champion. Every week." 
        },
        'standard_mcl': { 
            title: "2x Boost: Norris/Piastri", icon: "🧡", 
            desc: "Save Chips.", 
            logic: "Pick whichever McLaren driver qualified higher. They are consistent points machines." 
        }
    };

    // --- APP LOGIC ---
    let currentTeam = 1;

    function setTeam(id) {
        currentTeam = id;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.nav-btn[data-team="${id}"]`).classList.add('active');
        
        // Update Root Color for accent
        document.documentElement.style.setProperty('--accent', strategies[id].color);
        document.getElementById('team-label').innerText = `Active Strategy: ${strategies[id].name}`;
        
        loadQuestion(strategies[id].startNode);
    }

    function loadQuestion(nodeId) {
        const data = strategies[currentTeam].nodes[nodeId];
        const html = `
            <div class="card">
                <div class="card-header">Decision Node: ${nodeId.toUpperCase()}</div>
                <div class="question">${data.q}</div>
                <div class="context">${data.c}</div>
                <div class="actions">
                    <button class="btn btn-yes" onclick="handleResponse('${data.y}')">YES</button>
                    <button class="btn btn-no" onclick="handleResponse('${data.n}')">NO</button>
                </div>
            </div>
        `;
        document.getElementById('wizard-content').innerHTML = html;
    }

    function handleResponse(target) {
        // If target is a question key (q1, q2...)
        if (target.startsWith('q')) {
            loadQuestion(target);
        } else {
            // It's a result
            showResult(target);
        }
    }

    function showResult(key) {
        const res = results[key];
        const html = `
            <div class="card" style="border-top: 5px solid var(--success)">
                <span class="result-icon">${res.icon}</span>
                <div class="result-title">${res.title}</div>
                <div class="result-desc">${res.desc}</div>
                <div class="strategy-box">
                    <span class="strategy-label">Strategic Reasoning</span>
                    <span class="strategy-text">${res.logic}</span>
                </div>
                <div class="reset-link" onclick="setTeam(${currentTeam})">Restart Analysis</div>
            </div>
        `;
        document.getElementById('wizard-content').innerHTML = html;
    }

    function triggerEmergency() {
        const html = `
            <div class="card" style="border-color: var(--alert)">
                <div class="card-header" style="color: var(--alert)">⚠️ EMERGENCY PROTOCOL</div>
                <div class="question">Did your Premium Driver crash in Q3?</div>
                <div class="context">Only use this if your main points scorer (Max/Charles) is starting P15 or lower due to a crash.</div>
                <div class="actions">
                    <button class="btn" style="background:var(--alert); color:#fff" onclick="showResult('finalfix_max')">YES, THEY CRASHED</button>
                    <button class="btn btn-no" onclick="setTeam(${currentTeam})">FALSE ALARM</button>
                </div>
            </div>
        `;
        document.getElementById('wizard-content').innerHTML = html;
    }

    // Init
    setTeam(1);

</script>
</body>
</html>
