<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 F1 Fantasy Master Tool</title>
    <style>
        :root {
            --f1-red: #e10600;
            --rb-blue: #061D42;
            --mcl-papaya: #FF8700;
            --f1-dark: #15151e;
            --f1-card: #1f1f27;
            --text-light: #f0f0f0;
            --text-dim: #a0a0a0;
            --success: #2ecc71;
            --warning: #f1c40f;
        }

        body {
            font-family: 'Titillium Web', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--f1-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--f1-card);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #333;
        }

        h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- TEAM SELECTOR --- */
        .team-selector {
            display: flex;
            justify-content: center;
            padding: 15px;
            background: #000;
            gap: 10px;
        }

        .team-btn {
            background: #333;
            color: #fff;
            border: 2px solid transparent;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
        }

        .team-btn.active { opacity: 1; transform: scale(1.05); }
        .team-btn[data-team="1"].active { background: var(--f1-red); border-color: var(--f1-red); }
        .team-btn[data-team="2"].active { background: var(--rb-blue); border-color: #3671C6; }
        .team-btn[data-team="3"].active { background: var(--mcl-papaya); border-color: var(--mcl-papaya); color: #000; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- WIZARD STYLES --- */
        .wizard-step { display: none; animation: fadeIn 0.3s ease; }
        .wizard-step.active { display: block; }

        .question-card {
            background-color: var(--f1-card);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #333;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .team-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            background: #333;
            color: #aaa;
        }

        .question-text { font-size: 1.3rem; margin-bottom: 10px; font-weight: 700; }
        .question-sub { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 25px; line-height: 1.4; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
            text-transform: uppercase;
        }
        .btn:active { transform: scale(0.98); }
        .btn-yes { background-color: var(--success); color: #000; }
        .btn-no { background-color: #383842; color: white; }
        
        .result-card {
            background: linear-gradient(145deg, #1f1f27, #25252e);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            border-top: 4px solid var(--success);
        }
        .result-icon { font-size: 4rem; display: block; margin-bottom: 10px; }
        .result-name { font-size: 2rem; font-weight: 900; color: var(--text-light); margin: 10px 0; }
        .result-desc { color: #ccc; margin-bottom: 20px; line-height: 1.5; }
        .result-logic { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; text-align: left; font-size: 0.9rem; color: #ddd; border-left: 3px solid var(--text-dim); }

        .restart-btn {
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 12px;
            width: 100%;
            margin-top: 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <h1>2026 Strategy Engine</h1>
</header>

<div class="team-selector">
    <button class="team-btn active" data-team="1" onclick="setTeam(1)">Team 1: Alpha</button>
    <button class="team-btn" data-team="2" onclick="setTeam(2)">Team 2: RB Hedge</button>
    <button class="team-btn" data-team="3" onclick="setTeam(3)">Team 3: McLaren</button>
</div>

<div class="container">
    <div id="wizard-container">
        </div>
</div>

<script>
    let currentTeam = 1;
    let currentStep = 0;

    // Team Configurations & Logic Trees
    const teamData = {
        1: {
            name: "Alpha (Merc/Ferrari)",
            color: "#e10600",
            questions: [
                { id: 'q1', text: "Is it a Sprint Weekend?", sub: "Shanghai, Miami, Austin, Qatar", yes: "limitless", no: "next" },
                { id: 'q2', text: "Is Rain/Severe Weather forecast?", sub: "High chance of chaos/random grid", yes: "autopilot", no: "next" },
                { id: 'q3', text: "Is it a Street Circuit?", sub: "Monaco, Baku, Singapore (High crash risk)", yes: "nonegative", no: "next" },
                { id: 'q4', text: "Is it the Spanish or British GP?", sub: "Major Upgrade Cycles", yes: "wildcard", no: "next" },
                { id: 'q5', text: "Is it a Power Track?", sub: "Monza, Spa, Vegas (Long Straights)", yes: "3x_verstappen", no: "standard" }
            ]
        },
        2: {
            name: "Red Bull Hedge",
            color: "#061D42",
            questions: [
                { id: 'q1', text: "Is it a Sprint Weekend?", sub: "More points available for Max/Hadjar", yes: "limitless_rb", no: "next" },
                { id: 'q2', text: "Is it a Pure Power Track?", sub: "Monza, Spa (Where RB22 straight-line speed kills)", yes: "3x_rb", no: "next" },
                { id: 'q3', text: "Is it a High Downforce Track?", sub: "Monaco, Hungary (RB22 weakness)", yes: "autopilot", no: "next" },
                { id: 'q4', text: "Did Max Qualify Poorly (P10+)?", sub: "Is recovery likely but risky?", yes: "finalfix", no: "standard_rb" }
            ]
        },
        3: {
            name: "McLaren Loyalty",
            color: "#FF8700",
            questions: [
                { id: 'q1', text: "Is it a Sprint Weekend?", sub: "Maximize Lando/Oscar points", yes: "limitless", no: "next" },
                { id: 'q2', text: "Is it a High Tire-Degradation Track?", sub: "Silverstone, Barcelona, Suzuka", yes: "3x_mcl", no: "next" },
                { id: 'q3', text: "Are you running risky mid-fielders?", sub: "Gasly/Ocon in your lineup?", yes: "nonegative", no: "standard_mcl" }
            ]
        }
    };

    const results = {
        'limitless': { icon: '♾️', title: 'Limitless Chip', desc: 'Unlimited budget. Build the "God Squad" (Top 5 Drivers + Top 2 Teams).', reason: 'Sprint weekends offer 4 scoring events. Maximizes raw output.' },
        'limitless_rb': { icon: '♾️', title: 'Limitless (RB Focus)', desc: 'Unlimited budget. Ensure Max & Hadjar are locked.', reason: 'Sprint weekend. Even with unlimited budget, prioritize the RB22 speed advantage.' },
        'autopilot': { icon: '🤖', title: 'Autopilot', desc: 'Let the game pick your captain.', reason: 'Conditions are unpredictable. Don\'t risk a 2x on a DNF.' },
        'nonegative': { icon: '🛡️', title: 'No Negative', desc: 'Protect against DNFs.', reason: 'High attrition track. One crash could ruin your week.' },
        'wildcard': { icon: '🃏', title: 'Wildcard', desc: 'Rebuild your team permanently.', reason: 'Post-upgrade cycle. The pecking order has changed.' },
        '3x_verstappen': { icon: '🚀', title: '3x Boost: Verstappen', desc: 'Triple points on Max.', reason: 'Power track rewards RB22 energy deployment.' },
        '3x_rb': { icon: '🚀', title: '3x Boost: Max', desc: 'Triple points on Max.', reason: 'This is the track where the "Sandbagging" theory pays off. Massive straight line speed.' },
        '3x_mcl': { icon: '🧡', title: '3x Boost: Lando', desc: 'Triple points on Norris.', reason: 'MCL40 excels in tire wear. He will dominate the late race stages here.' },
        'finalfix': { icon: '🔧', title: 'Final Fix', desc: 'Swap Max for a front-row starter.', reason: 'Max started too far back. Secure points with a safer premium driver.' },
        'standard': { icon: '✅', title: '2x Boost: Hadjar', desc: 'Save your chips.', reason: 'Standard week. Hadjar is the safest value play in the RB22.' },
        'standard_rb': { icon: '🏎️', title: '2x Boost: Max', desc: 'Save chips. Captain Max.', reason: 'You are hedging on Red Bull dominance. Trust the RB22.' },
        'standard_mcl': { icon: '🧡', title: '2x Boost: Piastri/Norris', desc: 'Save chips. Captain McLaren.', reason: 'Consistent points finish expected.' }
    };

    function init() {
        setTeam(1);
    }

    function setTeam(id) {
        currentTeam = id;
        currentStep = 0;
        
        // Update UI Tabs
        document.querySelectorAll('.team-btn').forEach(btn => {
            btn.classList.remove('active');
            if(parseInt(btn.dataset.team) === id) btn.classList.add('active');
        });

        renderStep();
    }

    function renderStep() {
        const container = document.getElementById('wizard-container');
        const team = teamData[currentTeam];
        
        if (currentStep < team.questions.length) {
            const q = team.questions[currentStep];
            container.innerHTML = `
                <div class="wizard-step active">
                    <div class="question-card" style="border-top: 4px solid ${team.color}">
                        <div class="team-badge">${team.name} Strategy</div>
                        <div class="question-text">${q.text}</div>
                        <div class="question-sub">${q.sub}</div>
                        <div class="btn-grid">
                            <button class="btn btn-yes" onclick="handleAnswer('${q.yes}')">YES</button>
                            <button class="btn btn-no" onclick="handleAnswer('${q.no}')">NO</button>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // Fallback if no logic met
            showResult(currentTeam === 2 ? 'standard_rb' : (currentTeam === 3 ? 'standard_mcl' : 'standard'));
        }
    }

    function handleAnswer(outcome) {
        if (outcome === 'next') {
            currentStep++;
            renderStep();
        } else {
            showResult(outcome);
        }
    }

    function showResult(key) {
        const container = document.getElementById('wizard-container');
        const res = results[key];
        const team = teamData[currentTeam];

        container.innerHTML = `
            <div class="wizard-step active">
                <div class="result-card">
                    <span class="result-icon">${res.icon}</span>
                    <div class="result-name">${res.title}</div>
                    <div class="result-desc">${res.desc}</div>
                    <div class="result-logic">
                        <strong>Why?</strong> ${res.reason}
                    </div>
                    <button class="restart-btn" onclick="setTeam(${currentTeam})">Start Over</button>
                </div>
            </div>
        `;
    }

    // Start
    init();
</script>

</body>
</html>
